# CI for the TEMPLATE REPOSITORY. A generated project gets its own workflow, not this one.
#
# Two jobs, mirroring the two halves of the local gate:
#
# - `gate` runs the root's prek config on Linux: its markdown, its one test module and the
#   conventions check. `generation-tests` is skipped there because the next job is that suite.
# - `generation` runs on Linux and macOS, and on Windows when a manual run asks for it. It runs
#   tests/test_template.py (the base alone) and then the suite of python-template-cli-typer,
#   checked out into `cli/` and pointed at this checkout through BASE_TEMPLATE_DIR. That suite
#   generates projects with this base layered under the CLI layer and runs each one's own gate and
#   tests, so it is the only place the portability rules in template/CLAUDE.md are checked on a
#   real Windows or macOS, rather than by convention or WSL, and the only place a base change that
#   breaks the CLI layer shows up.
#
# The repo is public, so GitHub-hosted runners cost nothing on any OS. Actions are pinned by
# commit SHA with the release in a comment; a tag can be moved, a SHA cannot.

name: CI

# Every branch, not just main: pushing a branch is how to see macOS before merging, and a manual
# run with `windows` ticked is how to see Windows.
# There is no pull_request trigger — work arrives by merge into main, never by PR.
#
# Only a push that can change the result runs: the paths `generation-tests` in
# .pre-commit-config.yaml lists — keep the two in step — plus the root gate's config and this
# file. An allow-list, not `paths-ignore: ["**.md"]`: markdown under template/ ships, and a
# generated project's gate checks it. A push touching only TODO.md, README.md or CLAUDE.md runs
# nothing; the commit hooks have already checked that markdown locally. Run the workflow by hand
# (workflow_dispatch) to force a run.
on:
  push:
    paths:
      - "template/**"
      - "tests/**"
      - "copier.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".pre-commit-config.yaml"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      windows:
        description: Also run the generation suite on Windows
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Generation commits inside each project, and a fresh runner has no git identity. Environment
  # variables rather than `git config` steps, so they apply the same under every shell.
  GIT_AUTHOR_NAME: CI
  GIT_AUTHOR_EMAIL: ci@example.com
  GIT_COMMITTER_NAME: CI
  GIT_COMMITTER_EMAIL: ci@example.com

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      # no-commit-to-branch refuses work on main, which is what a push to main checks out.
      - run: uv run prek run --all-files --show-diff-on-failure --skip no-commit-to-branch --skip generation-tests

  generation:
    strategy:
      fail-fast: false
      matrix:
        # Windows only on a manual run that asks for it: the targets are Unix-alikes, and Windows
        # took ten times Linux's minutes. `inputs` is empty on a push, so a push runs two.
        # gh workflow run ci.yml --ref <branch> -f windows=true
        os: ${{ fromJSON(inputs.windows && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      BASE_TEMPLATE_DIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The update tests snapshot this checkout and move it forward, as a developer's clone would.
          fetch-depth: 0
      # The CLI layer at its `main`. Its suite is what exercises this base under a use case.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GrndZero101/python-template-cli-typer
          path: cli
          persist-credentials: false
      # No `python-version` input: it exports UV_PYTHON, which would override every generated
      # project's .python-version and quietly turn the 3.12 floor test into a 3.14 one.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          cache-python: true
      - run: uv sync --locked
      # prek and copier come from the dev group, so the suite finds them on the venv's PATH.
      - run: uv run pytest -ra
      # The CLI repo's own locked environment, with this checkout as the base under test.
      - run: uv sync --locked
        working-directory: cli
      - run: uv run pytest -ra
        working-directory: cli
