# copier template metadata for the BASE layer: the hooks, the gate, the skills every Python
# project shares, and a minimal pyproject.toml. Everything it generates is under `template/`.
#
# A use case (the repository python-template-cli-typer) is a second template applied to the same
# project. Its one task runs this template with `--defaults`, so the shared questions below are
# answered from the use case's answers file and nothing is asked twice. Run on its own, this
# template asks everything, which is how a prototype or a brownfield repo adopts the guards.
#
# On its own:  copier copy --trust gh:GrndZero101/python-template <destination>
# Update:      copier update --trust -a .copier-answers.base.yml
# --trust is required because of `_tasks` below; copier exits 4 without it.
_subdirectory: template

# Not the default `.copier-answers.yml`, which belongs to the use case. Two templates on one
# project need two answers files, or each would overwrite the other's.
_answers_file: .copier-answers.base.yml

# The use case's answers, when there is one. A missing file reads as an empty dict, so standalone
# every `default` below falls through to its own fallback.
_external_data:
  use_case: .copier-answers.yml

# The pyproject.toml here is a fallback for a project with none. A use case writes its own first,
# and copier never overwrites a file listed here.
_skip_if_exists:
  - pyproject.toml

_message_after_copy: |
  Base layer applied to {{ _copier_conf.dst_path }}. Read CLAUDE.md first — the rules there are
  enforced by a gate, not by convention alone.

# ---------------------------------------------------------------------------
# Questions shared with every use case
# ---------------------------------------------------------------------------
# Each is defined in the use case's copier.yml too, and a generation test asserts the two agree.
project_name:
  type: str
  help: Project name, as a human would write it (e.g. "Weather Tools")
  default: "{{ _external_data.use_case.project_name | default('') }}"
  validator: "{% if not project_name %}project_name is required{% endif %}"

author_name:
  type: str
  help: Author name
  default: "{{ _external_data.use_case.author_name | default('') }}"

author_email:
  type: str
  help: Author email
  default: "{{ _external_data.use_case.author_email | default('') }}"

# A choice, not free text: the shipped code uses `typing.override`, so anything below 3.12 passes
# its gate and then fails at import. `.python-version` is rendered from this, so the venv, the
# tests and ty all run at the floor and prove it on every run.
python_version:
  type: str
  help: Minimum Python version
  default: "{{ _external_data.use_case.python_version | default('3.14') }}"
  choices:
    - "3.12"
    - "3.13"
    - "3.14"

# What the licence is, and whose name is on it. The year is recorded when the project is generated.
# A computed value is dropped from the answers file unless the answers-file template adds it back,
# and then recomputed on every update, so `copier update` would quietly roll the year forward:
# `default` reads the recorded year if there is one, and the answers-file template writes it down.
license:
  type: str
  help: Licence
  default: "{{ _external_data.use_case.license | default('MIT') }}"
  choices:
    - MIT
    - Apache-2.0
    - Proprietary

copyright_holder:
  type: str
  help: Name on the copyright line
  default: "{{ _external_data.use_case.copyright_holder | default(author_name) }}"

copyright_year:
  type: str
  default: "{{ _external_data.use_case.copyright_year | default(copyright_year | default('%Y' | strftime)) }}"
  when: false

# ---------------------------------------------------------------------------
# What not to copy
# ---------------------------------------------------------------------------
_exclude:
  - "copier.yml"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".git"
  - ".venv"

# ---------------------------------------------------------------------------
# Side effects, run in the generated project
# ---------------------------------------------------------------------------
# The base owns every bootstrap task, so a use case need not repeat them. Each entry is a list, so
# it is executed directly rather than through a shell — the same portability rule the template's
# own hooks follow.
#
# All three prek shims are installed. `prek install` alone wires only pre-commit, which
# silently disables the commit-message check and makes `git merge --no-ff` into main fail.
#
# ORDER MATTERS. The initial commit happens BEFORE the shims are installed, because the project's
# own `no-commit-to-branch` rule would otherwise block it — a generated project starts on `main`,
# which is exactly where that hook refuses to commit. Committing first also means `copier update`
# has the clean tree it requires, and it gives `prek run --all-files` tracked files to look at:
# prek sees only what git knows about, so before the first commit the whole gate reports
# "no files to check" and passes vacuously.
#
# Every task is guarded to the initial copy. On `copier update` the project is already a git
# repo with the shims installed, and re-running the commit task fails outright: by then the
# project's own `no-commit-to-branch` hook is live and the project is on `main`, which is
# exactly the commit that hook exists to refuse. An update therefore leaves its changes in the
# working tree for review, which is the right behaviour anyway.
_tasks:
  - command: ["git", "init", "-b", "main"]
    when: "{{ _copier_operation == 'copy' }}"
  - command: ["uv", "sync"]
    when: "{{ _copier_operation == 'copy' }}"
  - command: ["git", "add", "-A"]
    when: "{{ _copier_operation == 'copy' }}"
  - command: ["git", "commit", "-m", "chore: generate project from python-template"]
    when: "{{ _copier_operation == 'copy' }}"
  - command: ["prek", "install"]
    when: "{{ _copier_operation == 'copy' }}"
  - command: ["prek", "install", "-t", "commit-msg"]
    when: "{{ _copier_operation == 'copy' }}"
  - command: ["prek", "install", "-t", "pre-merge-commit"]
    when: "{{ _copier_operation == 'copy' }}"
