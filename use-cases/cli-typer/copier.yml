# copier template metadata for the CLI use case: a typer command-line tool, its tests, and the
# skills that teach a model to extend it. The generated files are everything under `template/`.
#
# This is a layer, not a whole project. Its one task applies the BASE template (the hooks, the
# gate, `CLAUDE.md`, `tools/`, the shared skills) to the same directory, so a single `copier copy`
# of this template yields both, each with its own answers file and its own source for updates.
#
# Run with:  copier copy --trust gh:GrndZero101/python-template-cli-typer <destination>
# Update:    copier update --trust                          (this layer)
#            copier update --trust -a .copier-answers.base.yml    (the base layer)
# Each update needs a clean working tree, and each touches only its own layer's files.
_subdirectory: template

_message_after_copy: |
  Project created in {{ _copier_conf.dst_path }}.

  The git repo, the venv and all three prek shims are already wired.

# ---------------------------------------------------------------------------
# Questions
# ---------------------------------------------------------------------------
project_name:
  type: str
  help: Project name, as a human would write it (e.g. "Weather Tools")

package_name:
  type: str
  help: Importable package name, under src/
  default: "{{ project_name | lower | replace('-', '_') | replace(' ', '_') }}"
  validator: >-
    {% if not package_name %}package_name is required
    {% elif not (package_name | regex_search('^[a-z_][a-z0-9_]*$')) %}
    must be lower case, start with a letter or underscore, and contain only letters, digits
    and underscores; got "{{ package_name }}"
    {% endif %}

script_name:
  type: str
  help: Console script name, the command typed in a terminal
  default: "{{ package_name | replace('_', '-') }}"
  # Never default to `cli`. On Windows `cli` is a read-only PowerShell alias for `Clear-Item`,
  # and an alias wins over an executable on PATH, so the command would be unreachable from the
  # shell most Windows users are in. It is not unique either — every generated project would
  # install the same name into the same environment.
  validator: >-
    {% if not script_name %}script_name is required
    {% elif script_name == 'cli' %}
    `cli` is a read-only PowerShell alias for Clear-Item on Windows and would be shadowed;
    pick something specific to this project
    {% elif not (script_name | regex_search('^[a-z][a-z0-9-]*$')) %}
    must be lower case and contain only letters, digits and hyphens; got "{{ script_name }}"
    {% endif %}

# Typer derives the shell-completion variable by upper-casing prog_name and replacing hyphens
# with underscores. Computed rather than asked — it is not a decision, just a consequence.
completion_env_var:
  type: str
  default: "_{{ script_name | upper | replace('-', '_') }}_COMPLETE"
  when: false

project_description:
  type: str
  help: One-line description
  default: ""

# Every question from here through `copyright_year` is also asked by the base template, which
# reads these answers instead of asking again. A generation test asserts the two definitions agree.
author_name:
  type: str
  help: Author name

author_email:
  type: str
  help: Author email

# A choice, not free text: the scaffold uses `typing.override`, so anything below 3.12 generates a
# project that passes its gate and then fails at import. `.python-version` is rendered from this,
# so the venv, the tests and ty all run at the floor and prove it on every run.
python_version:
  type: str
  help: Minimum Python version
  default: "3.14"
  choices:
    - "3.12"
    - "3.13"
    - "3.14"

# What the licence is, and whose name is on it. The year is recorded when the project is generated.
# A computed value is dropped from the answers file unless the answers-file template adds it back,
# and then recomputed on every update, so `copier update` would quietly roll the year forward:
# `default` reads the recorded year if there is one, and the answers-file template writes it down.
license:
  type: str
  help: Licence
  default: "MIT"
  choices:
    - MIT
    - Apache-2.0
    - Proprietary

copyright_holder:
  type: str
  help: Name on the copyright line
  default: "{{ author_name }}"

copyright_year:
  type: str
  default: "{{ copyright_year | default('%Y' | strftime) }}"
  when: false

# An answer, not a constant, so the generation tests and the base's CI can point it at a local
# checkout. It is recorded in `.copier-answers.yml`, which makes the base's origin visible.
base_template:
  type: str
  help: Where the base template comes from
  default: gh:GrndZero101/python-template

# ---------------------------------------------------------------------------
# What not to copy
# ---------------------------------------------------------------------------
_exclude:
  - "copier.yml"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".git"
  - ".venv"

# ---------------------------------------------------------------------------
# Side effects, run in the generated project
# ---------------------------------------------------------------------------
# One task: apply the base. It owns `git init`, `uv sync`, the first commit and the prek shims, and
# it runs after this template's files are in place, so `uv sync` finds a pyproject.toml and the
# commit holds both layers. `--defaults` because the shared answers come from this layer's answers
# file, not from the user. Guarded to the initial copy: an update applies the base separately.
_tasks:
  - command: ["copier", "copy", "--trust", "--defaults", "{{ base_template }}", "."]
    when: "{{ _copier_operation == 'copy' }}"
