# Configuration for the TEMPLATE REPOSITORY, not for a generated project.
#
# There is deliberately no [project] table and no dependency list: the root is not a Python
# package and has no venv of its own. Everything Python lives in `template/`, which carries the
# full ruff/ty/rumdl configuration that a generated project receives.
#
# This file exists so `rumdl` applies the same line length to the repo's own markdown as the
# template applies to its.
[tool.rumdl]
line-length = 100
respect-gitignore = true
exclude = [".venv", "node_modules", "template"]

[tool.rumdl.MD013]
code_blocks = false  # never wrap code
tables = false
