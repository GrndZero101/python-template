# The gate for the TEMPLATE REPOSITORY itself. Run with: prek run --all-files
#
# `.git` lives here, at the root, so `prek install` wires the git hooks to this file and this
# file is what every commit-time guard reads. That is why the root cannot be metadata-only.
#
# The division of labour is deliberate:
#
# - Everything here EXCLUDES `template/`, and covers only the repo's own markdown and the
#   commit-level rules that need a `.git` to act on.
# - No code checking appears here at all. prek treats a nested `.pre-commit-config.yaml` as a
#   workspace member, so files under `template/` are routed to that config and run with
#   `template/` as the working directory. The lint list therefore exists exactly once, in the
#   file a generated project actually receives.
#
# A second copy at this level would have to duplicate the dependency list and build a second venv
# as well, because `ty` resolves imports through the project environment.
#
# NOTE: workspace discovery is a prek extension; plain `pre-commit` does not have it and would
# leave `template/` unchecked. That is the same trade already made for `repo: builtin` below.
repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        exclude: ^template/
      - id: end-of-file-fixer
        exclude: ^template/
      - id: check-merge-conflict
        exclude: ^template/
      - id: check-added-large-files
      - id: check-yaml
        exclude: ^template/
      - id: detect-private-key
      # Work happens on a branch; main only ever receives merge commits. See the note in
      # template/.pre-commit-config.yaml — `stages: [pre-commit]` is what lets `--no-ff` through.
      - id: no-commit-to-branch
        args: [--branch, main]
        stages: [pre-commit]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.45
    hooks:
      - id: rumdl-fmt
        exclude: ^template/
      - id: rumdl
        exclude: ^template/
