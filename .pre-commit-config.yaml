# The gate for the TEMPLATE REPOSITORY itself. Run with: prek run --all-files
#
# `.git` lives here, at the root, so `prek install` wires the git hooks to this file and this
# file is what every commit-time guard reads. That is why the root cannot be metadata-only.
#
# The division of labour is deliberate:
#
# - Every file check here EXCLUDES `template/`. It holds Jinja and no `pyproject.toml`, so ruff
#   would fall back to default rules and ty would have no environment to resolve imports through.
#   Its own config is suffixed `.jinja` for the same reason: prek would otherwise adopt it as a
#   workspace member and run a gate there that is guaranteed to fail.
# - What checks `template/` instead is `generation-tests` below: it generates a project per type
#   and runs THAT project's gate inside it, so the lint list exists exactly once, in the file a
#   generated project actually receives.
# - The rest covers the repo's own markdown, its one Python test module, and the commit-level
#   rules that need a `.git` to act on.
#
# NOTE: `repo: builtin` is a prek extension and is NOT understood by plain `pre-commit`.
repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        exclude: ^template/
      - id: end-of-file-fixer
        exclude: ^template/
      # --assume-in-merge: see template/.pre-commit-config.yaml.jinja.
      - id: check-merge-conflict
        args: [--assume-in-merge]
        exclude: ^template/
      - id: check-added-large-files
      - id: check-yaml
        exclude: ^template/
      - id: check-toml
      # template/ ships JSONC under .vscode/, which check-json would reject; a generated
      # project's own gate checks the strict-JSON files it receives.
      - id: check-json
        exclude: ^template/
      - id: detect-private-key
      # Work happens on a branch; main only ever receives merge commits. See the note in
      # template/.pre-commit-config.yaml — `stages: [pre-commit]` is what lets `--no-ff` through.
      - id: no-commit-to-branch
        args: [--branch, main]
        stages: [pre-commit]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.78
    hooks:
      - id: rumdl-fmt
        exclude: ^template/
      - id: rumdl
        exclude: ^template/

  # The root's own Python is just the generation tests, but they are held to the same rules.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      # The fixer before the formatter: a fix can leave code that needs reformatting.
      - id: ruff-check
        args: [--fix]
        exclude: ^template/
      - id: ruff-format
        exclude: ^template/

  - repo: local
    hooks:
      # The template's own custom checker, reused on the repo that ships it. It is a literal
      # .py file, so it runs here unchanged.
      - id: no-nested-defs
        name: no nested function definitions
        entry: uv run python template/tools/check_nested_defs.py
        language: system
        types: [python]
        exclude: ^template/

      # The only thing that verifies template/. It generates a project for each project type
      # and runs that project's gate and test suite inside it, so it is slow — around a minute.
      # That is the price of template/ not being lintable in place.
      #
      # `files:` scopes it to what can change a generated project: the template, the copier
      # config, the tests themselves, and the dependencies that run them. A commit touching only
      # TODO.md or this repo's own docs skips it. The PostToolUse hook in .claude/settings.json
      # skips it too, so a minute-long suite never runs on save. To skip it at commit as well:
      #   SKIP=generation-tests git commit ...
      # `stages: [pre-commit]` is load-bearing. Without it the hook also fires at the commit-msg
      # stage, running the whole minute-long suite a second time for a message check.
      - id: generation-tests
        name: generate projects and run their gates
        entry: uv run pytest tests
        language: system
        pass_filenames: false
        files: ^(template/|tests/|copier\.yml$|pyproject\.toml$|uv\.lock$)
        stages: [pre-commit]
