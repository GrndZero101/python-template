# The gate for the TEMPLATE REPOSITORY itself. Run with: prek run --all-files
#
# `.git` lives here, at the root, so `prek install` wires the git hooks to this file and this
# file is what every commit-time guard reads. That is why the root cannot be metadata-only.
#
# The division of labour is deliberate:
#
# - Every file check here EXCLUDES `template/`. It holds Jinja and no `pyproject.toml`, so ruff
#   would fall back to default rules and ty would have no environment to resolve imports through.
#   Its own config is suffixed `.jinja` for the same reason: prek would otherwise adopt it as a
#   workspace member and run a gate there that is guaranteed to fail.
# - What checks it instead is `generation-tests` below: it generates the base on its own and runs
#   THAT project's gate inside it, so the lint list exists exactly once, in the file a generated
#   project actually receives. The base layered under a use case is checked by the CLI repo's
#   suite, which this repo's CI runs against the commit under test (see .github/workflows/ci.yml).
# - The rest covers the repo's own markdown, its one Python test module, and the commit-level
#   rules that need a `.git` to act on.
#
# NOTE: `repo: builtin` is a prek extension and is NOT understood by plain `pre-commit`.

# Hooks with no `stages` of their own skip commit-msg; see template/.pre-commit-config.yaml.jinja.
default_stages: [pre-commit, pre-merge-commit, manual]

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        exclude: ^template/
      - id: end-of-file-fixer
        exclude: ^template/
      # --assume-in-merge: see template/.pre-commit-config.yaml.jinja.
      - id: check-merge-conflict
        args: [--assume-in-merge]
        exclude: ^template/
      - id: check-added-large-files
      - id: check-yaml
        exclude: ^template/
      - id: check-toml
      # template/ ships JSONC under .vscode/, which check-json would reject; a generated
      # project's own gate checks the strict-JSON files it receives.
      - id: check-json
        exclude: ^template/
      - id: detect-private-key
      # Work happens on a branch; main only ever receives merge commits. See the note in
      # template/.pre-commit-config.yaml — `stages: [pre-commit]` is what lets `--no-ff` through.
      - id: no-commit-to-branch
        args: [--branch, main]
        stages: [pre-commit]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.78
    hooks:
      - id: rumdl-fmt
        exclude: ^template/
      - id: rumdl
        exclude: ^template/

  # The root's own Python is just the generation tests, but they are held to the same rules.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      # The fixer before the formatter: a fix can leave code that needs reformatting.
      - id: ruff-check
        args: [--fix]
        exclude: ^template/
      - id: ruff-format
        exclude: ^template/

  # bootstrap.sh runs before anything else is installed, under whatever /bin/sh is: dash on Ubuntu,
  # bash in POSIX mode on macOS. --shell=sh holds it to POSIX, whatever its shebang says.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--shell=sh]
        exclude: ^template/

  - repo: local
    hooks:
      # The template's ty hook, as template/.pre-commit-config.yaml.jinja explains: ty-pre-commit
      # skips every file with a PEP 723 header, which is bootstrap.py. pyproject.toml excludes
      # template/ from it.
      - id: ty
        name: ty
        entry: uv run --with ty==0.0.84 ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        always_run: true
        require_serial: true

      # The template's own custom checker, reused on the repo that ships it. It is a literal
      # .py file, so it runs here unchanged.
      - id: conventions
        name: CLAUDE.md conventions (tools/check_conventions.py)
        entry: uv run python template/tools/check_conventions.py
        language: system
        types: [python]
        exclude: ^template/

      # The only local check of template/. It generates the base on its own and runs that
      # project's gate and test suite inside it, which is slow — around fifteen seconds. That is the
      # price of the template not being lintable in place. The layered projects are CI's job.
      #
      # `files:` scopes it to what can change a generated project: the template, the copier
      # config, the tests themselves, and the dependencies that run them; and to the bootstrap
      # files, whose tests are quick and live beside the generation tests. A commit touching only
      # TODO.md or this repo's own docs skips it. `.github/workflows/ci.yml` filters pushes on the
      # same paths; change both together. The PostToolUse hook in .claude/settings.json
      # skips it too, so a minute-long suite never runs on save. To skip it at commit as well:
      #   SKIP=generation-tests git commit ...
      # `stages: [pre-commit]` is load-bearing. Without it the hook also fires at
      # pre-merge-commit, running the whole suite again for a merge that finish_branch.py has
      # already gated.
      - id: generation-tests
        name: generate projects and run their gates
        entry: uv run pytest tests
        language: system
        pass_filenames: false
        files: ^(template/|tests/|copier\.yml$|pyproject\.toml$|uv\.lock$|bootstrap\.(sh|py)$)
        stages: [pre-commit]
